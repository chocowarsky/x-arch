[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-arch"
version = "0.2.0"
description = "Find the real earliest activity, circadian behavioral rhythms, and uncompressed media of any X/Twitter account, verified against independent archives."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Warsky" }
]
keywords = ["twitter", "x", "osint", "wayback-machine", "snowflake-id", "archive", "circadian-analysis", "media-extractor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Sociology :: History",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3", "respx>=0.21"]

[project.scripts]
x-arch = "x_arch.cli:main"
x-archaeologist = "x_arch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
